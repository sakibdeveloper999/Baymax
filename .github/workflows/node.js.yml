name: Node.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capacity_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: baymax_capacity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capacity_test -d baymax_capacity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          CAPACITY_TEST_DATABASE_URL: postgresql://capacity_test:isolated_ci_password@127.0.0.1:5432/baymax_capacity_test
      - run: npm ci
        working-directory: desktop
      - run: npm test -- --runInBand
        working-directory: desktop
      - run: npm run react-build
        working-directory: desktop
